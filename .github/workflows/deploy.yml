name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验前端可独立运行
        run: |
          test -f site/index.html
          test -f site/sample-data.js
          echo "示例题库条目数: $(grep -c 'src:' site/sample-data.js)"

      - uses: actions/configure-pages@v5

      # 只发布 site/ 目录：不会把 papers/、data/raw/ 里的题目内容带上
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
